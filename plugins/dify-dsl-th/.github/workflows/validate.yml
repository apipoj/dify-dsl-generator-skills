name: Validate Skills

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate Skill Structure
        run: python3 scripts/quick_validate.py

      - name: Check Git Marketplace Package
        run: python3 scripts/sync_marketplace.py --check

      - name: Test Thai and Claude Distribution
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build Native Plugins
        run: python3 scripts/build_plugin_bundle.py

      - name: Upload Native Plugins
        uses: actions/upload-artifact@v4
        with:
          name: dify-dsl-plugins
          path: dist/dify-dsl-plugins.zip

      - name: Build Claude.ai Skill
        run: python3 scripts/build_claude_ai_bundle.py

      - name: Upload Claude.ai Skill
        uses: actions/upload-artifact@v4
        with:
          name: dify-dsl-th
          path: dist/dify-dsl-th.zip

  forward-testing:
    runs-on: ubuntu-latest
    needs: structure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate Forward Testing
        run: python3 scripts/validate_forward_testing.py

      - name: Upload Forward Testing Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-testing-report
          path: .forward-testing/latest-report.json
          if-no-files-found: warn
