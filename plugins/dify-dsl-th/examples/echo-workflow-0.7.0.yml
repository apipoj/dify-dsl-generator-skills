kind: app
version: '0.7.0'
app:
  name: รับข้อความและส่งกลับ
  description: ตัวอย่าง Workflow ภาษาไทย ไม่ใช้โมเดลหรือ API ภายนอก
  mode: workflow
  icon: '🤖'
  icon_type: emoji
  icon_background: '#FFEAD5'
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
      - id: start_node
        type: custom
        position: {x: 80, y: 120}
        sourcePosition: right
        targetPosition: left
        data:
          title: รับข้อความ
          type: start
          desc: ''
          selected: false
          variables:
            - variable: query
              label: ข้อความที่ต้องการส่งกลับ
              type: text-input
              required: true
              max_length: 1000
      - id: end_node
        type: custom
        position: {x: 420, y: 120}
        sourcePosition: right
        targetPosition: left
        data:
          title: ส่งผลลัพธ์
          type: end
          desc: ''
          selected: false
          outputs:
            - variable: answer
              value_type: string
              value_selector: [start_node, query]
    edges:
      - id: start-to-end
        type: custom
        source: start_node
        sourceHandle: source
        target: end_node
        targetHandle: target
        data:
          sourceType: start
          targetType: end
          isInIteration: false
          isInLoop: false
    viewport: {x: 0, y: 0, zoom: 1}
